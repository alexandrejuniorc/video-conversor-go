services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-conversor-go-app
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/uploads
      - .:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=video-conversor-go
      - DB_SSL_MODE=disable
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET=video-conversor-go
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - localstack
    networks:
      - video-conversor-go-network
    restart: unless-stopped
    tty: true
    stdin_open: true

  postgres:
    image: postgres:14-alpine
    container_name: video-conversor-go-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=video-conversor-go
    networks:
      - video-conversor-go-network
    restart: unless-stopped

  localstack:
    image: localstack/localstack:1.4
    container_name: video-conversor-go-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    networks:
      - video-conversor-go-network
    restart: unless-stopped

networks:
  video-conversor-go-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
